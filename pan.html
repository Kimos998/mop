    :root {

      --primary-dark: #2563eb;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-500: #6b7280;
      --gray-700: #374151;
      --gray-900: #111827;
      --success: #10b981;
      --radius-sm: 8px;
      --radius: 12px;

    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);

      line-height: 1.6;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }
    .top-bar {
      background: white;
      border-radius: var(--radius);
      border: 1px solid var(--gray-200);
      padding: 0.75rem;
      margin-bottom: 1.75rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .search-input {
      width: 100%;
      padding: 0.65rem 1rem;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      color: var(--gray-900);
      outline: none;
      transition: var(--transition);
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    }
    .filters-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: center;
    }
    .filter-btn {
      padding: 0.6rem 1.15rem;
      border: 1px solid var(--gray-300);
      background: white;
      border-radius: var(--radius);
      font-weight: 500;
      color: var(--gray-700);
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .filter-btn:hover {
      border-color: var(--primary);
      background: rgba(59,130,246,0.04);
      color: var(--primary);
    }
    .filter-btn.active {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
      font-weight: 600;
    }
    .cartes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 1.5rem;
    }
    .carte {
      background: white;
      border-radius: var(--radius);
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: var(--transition);
    }
    .carte:hover {
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.06);
    }
    .entete {
      padding: 0.9rem 1.25rem;
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-200);
      font-weight: 600;
      font-size: 1rem;
      color: var(--gray-900);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .entete span {
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-size: 0.9rem;
    }
    .texte {
      padding: 1.25rem;
      white-space: pre-wrap;
      font-family: 'Courier New', Consolas, monospace;
      font-size: 0.95rem;
      line-height: 1.65;
      color: var(--gray-700);
      background: white;
      min-height: 160px;
      max-height: 520px;
      overflow-y: auto;
    }
    .btn {
      padding: 0.55rem 1.1rem;
      border-radius: var(--radius-sm);
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: var(--transition);
      font-size: 0.88rem;
      border: none;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background: var(--primary-dark);
    }
    .btn-success {
      background: var(--success);
      color: white;
    }
    .toast-container {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .toast {
      background: var(--gray-900);
      color: white;
      padding: 0.9rem 1.4rem;
      border-radius: var(--radius);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.5s forwards;

    @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; transform: translateY(-12px); } }

    .side-quick-btn {
      position: fixed;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      background: rgba(100, 116, 139, 0.22);
      color: #475569;
      border-radius: 50%;

      align-items: center;
      justify-content: center;

      font-weight: 500;

    .side-quick-btn:hover {
      background: rgba(100, 116, 139, 0.38);
      opacity: 1;
      transform: translateY(-50%) scale(1.08);
    }
    .side-quick-panel {
      position: fixed;
      right: -240px;
      top: 0;
      width: 220px;
      height: 100%;
      background: #f8fafc;
      border-left: 1px solid #e2e8f0;
      transition: right 0.28s ease;
      z-index: 780;
      padding: 3rem 0.8rem 1.2rem;
      color: #1e293b;
    }
    .side-quick-panel.open { right: 0; }
    .panel-item {
      display: block;
      padding: 0.9rem 1.1rem;
      color: #334155;
      text-decoration: none;
      font-size: 1.02rem;
      border-radius: 8px;
      margin: 0.4rem 0;
      transition: all 0.18s ease;
    }
    .panel-item:hover {
      background: #f1f5f9;
      color: #0f172a;
      padding-left: 1.4rem;
    }
    .side-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.28s ease;
      z-index: 770;
    }
    .side-overlay.open {
      opacity: 1;
      visibility: visible;
    }

      .side-quick-btn { width: 44px; height: 44px; font-size: 24px; right: 12px; }
      .side-quick-panel { width: 200px; }
    }
  </style>
</head>

  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<i class="${icon}"></i> ${msg}`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 2750);
}

const container = document.getElementById('liste-boutons');
const searchInput = document.getElementById('searchInput');
let activeIndex = 0;

function renderButtons(filterText = '') {
  container.innerHTML = '';
  const query = filterText.trim().toLowerCase();

  const matches = modeles
    .map((m, i) => ({ m, i }))
    .filter(({ m }) => {
      if (!query) return true;
      return (
        m.raison.toLowerCase().includes(query) ||
        m.client.toLowerCase().includes(query) ||
        m.vendeur.toLowerCase().includes(query) ||
        m.action.toLowerCase().includes(query)
      );
    });

  matches.forEach(({ m, i }) => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (i === activeIndex ? ' active' : '');
    btn.textContent = m.raison;
    btn.onclick = () => {
      activeIndex = i;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      afficher(i);
    };
    container.appendChild(btn);
  });

  if (matches.length > 0 && !matches.some(item => item.i === activeIndex)) {
    activeIndex = matches[0].i;
    afficher(activeIndex);
    if (container.firstChild) container.firstChild.classList.add('active');
  }
}

function afficher(index) {
  const m = modeles[index];
  if (!m) return;
  document.getElementById('client').textContent = m.client?.trim() || '(vide)';
  document.getElementById('vendeur').textContent = m.vendeur?.trim() || '(vide)';
  document.getElementById('action').textContent = m.action?.trim() || '(vide)';
}

function copier(id, btnEl) {
  const txt = document.getElementById(id).textContent.trim();
  if (!txt || txt === '(vide)' || txt === '-') {
    toast('Aucun contenu à copier', 'icon-alert-triangle');
    return;
  }
  navigator.clipboard.writeText(txt).then(() => {
    toast('Copié dans le presse-papiers', 'icon-check');
    if (btnEl) {
      const label = btnEl.querySelector('span');
      const oldText = label ? label.textContent : 'Copier';
      btnEl.classList.remove('btn-primary');
      btnEl.classList.add('btn-success');
      if (label) label.textContent = 'Copié !';
      setTimeout(() => {
        btnEl.classList.remove('btn-success');
        btnEl.classList.add('btn-primary');
        if (label) label.textContent = oldText;
      }, 1400);
    }
  }).catch(() => {
    toast('Échec de la copie', 'icon-alert-triangle');
  });
}

searchInput.addEventListener('input', (e) => {
  renderButtons(e.target.value);
});

document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('sideQuickBtn');
  const panel = document.getElementById('sideQuickPanel');
  const overlay = document.getElementById('sideOverlay');

  function closePanel() {
    panel.classList.remove('open');
    overlay.classList.remove('open');
  }

  btn.addEventListener('click', () => {
    panel.classList.toggle('open');
    overlay.classList.toggle('open');
  });

  overlay.addEventListener('click', closePanel);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePanel();
  });
});
